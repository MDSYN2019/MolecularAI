<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MolecularAI Logo</title>
  <desc id="desc">A hexagonal molecule mark connected to neural nodes with the text MolecularAI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#101A35"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="40" x2="310" y2="260">
      <stop offset="0%" stop-color="#46E6B0"/>
      <stop offset="100%" stop-color="#5A9BFF"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="320" rx="24" fill="url(#bg)"/>

  <!-- Molecule hexagon -->
  <g filter="url(#softGlow)">
    <polygon points="120,96 180,62 240,96 240,166 180,201 120,166" fill="none" stroke="url(#accent)" stroke-width="8"/>
    <line x1="120" y1="96" x2="240" y2="166" stroke="#2A3E78" stroke-width="4"/>
    <line x1="240" y1="96" x2="120" y2="166" stroke="#2A3E78" stroke-width="4"/>
  </g>

  <!-- Nodes -->
  <g>
    <circle cx="120" cy="96" r="12" fill="#46E6B0"/>
    <circle cx="180" cy="62" r="12" fill="#5A9BFF"/>
    <circle cx="240" cy="96" r="12" fill="#46E6B0"/>
    <circle cx="240" cy="166" r="12" fill="#5A9BFF"/>
    <circle cx="180" cy="201" r="12" fill="#46E6B0"/>
    <circle cx="120" cy="166" r="12" fill="#5A9BFF"/>
  </g>

  <!-- AI network sparks -->
  <g stroke="#7FC5FF" stroke-width="4" stroke-linecap="round">
    <line x1="260" y1="110" x2="320" y2="80"/>
    <line x1="260" y1="148" x2="330" y2="162"/>
    <line x1="208" y1="216" x2="262" y2="252"/>
  </g>
  <g>
    <circle cx="320" cy="80" r="8" fill="#7FC5FF"/>
    <circle cx="330" cy="162" r="8" fill="#7FC5FF"/>
    <circle cx="262" cy="252" r="8" fill="#7FC5FF"/>
  </g>

  <!-- Wordmark -->
  <text x="380" y="144" fill="#EAF2FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="1">MolecularAI</text>
  <text x="382" y="190" fill="#98B7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="3">CHEMISTRY × MACHINE LEARNING</text>
</svg>
