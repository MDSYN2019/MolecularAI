services:
  postgres:
    image: mcs07/postgres-rdkit:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-molecules}
      POSTGRES_USER: ${POSTGRES_USER:-molecule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-molecule}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/10-rdkit.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
